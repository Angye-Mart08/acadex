openapi: 3.1.0
info:
  title: API de Tutorías y Monitorías Académicas - Unitrópico
  version: 2.0.0
  summary: Contrato REST para la plataforma web de acompañamiento académico
  description: |
    Contrato de API para la plataforma web de gestión de tutorías y monitorías
    académicas de la Fundación Universitaria Internacional del Trópico Americano
    (Unitrópico). Arquitectura: React + TypeScript -> Node.js + TypeScript -> MariaDB.
    Fechas ISO 8601 y zona horaria institucional America/Bogota.
  contact:
    name: Equipo de desarrollo Unitrópico
    email: soporte.tutorias@unitropico.edu.co
  license:
    name: Uso institucional Unitrópico
servers:
  - url: http://localhost:3000/api/v1
    description: API local de desarrollo
  - url: http://localhost:4010
    description: Mock local generado con Prism; Prism expone las rutas desde la raíz
  - url: https://api.tutorias.unitropico.edu.co/api/v1
    description: Producción
tags:
  - name: Autenticación
  - name: Usuarios y roles
  - name: Dashboard
  - name: Solicitudes
  - name: Disponibilidad
  - name: Sesiones
  - name: Asistencia y seguimiento
  - name: Evidencias
  - name: Catálogos académicos
  - name: Reportes
  - name: Informes mensuales
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { codigo: EST20260125, password: ClaveSegura123 }
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                preAuthToken: pre_eyJhbGciOiJub25l
                requiresRoleSelection: true
                user:
                  idUsuario: 25
                  codigo: EST20260125
                  nombres: Laura
                  apellidos: Hernández Rojas
                  correo: laura.hernandez@unitropico.edu.co
                  roles: [ESTUDIANTE, MONITOR]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/select-role:
    post:
      tags: [Autenticación]
      summary: Seleccionar el rol activo
      operationId: selectRole
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectRoleRequest' }
            example: { preAuthToken: pre_eyJhbGciOiJub25l, idRol: 2 }
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar tokens
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Tokens renovados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: Sesión cerrada correctamente. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar usuario autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: Perfil y rol activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /roles:
    get:
      tags: [Usuarios y roles]
      summary: Listar roles
      operationId: listRoles
      x-roles: [ADMINISTRADOR]
      responses:
        '200':
          description: Catálogo de roles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users:
    get:
      tags: [Usuarios y roles]
      summary: Consultar usuarios
      operationId: listUsers
      x-roles: [ADMINISTRADOR]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/RoleName' } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoUsuario' } }
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedUsers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Usuarios y roles]
      summary: Crear usuario
      operationId: createUser
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            example:
              codigo: MON20260125
              documento: '1009123456'
              nombres: Laura
              apellidos: Hernández Rojas
              correo: laura.hernandez@unitropico.edu.co
              telefono: '3185550123'
              roleIds: [2]
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{idUsuario}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [Usuarios y roles]
      summary: Consultar usuario por ID
      operationId: getUser
      x-roles: [ADMINISTRADOR]
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Usuarios y roles]
      summary: Actualizar usuario
      operationId: updateUser
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/dashboard:
    get:
      tags: [Dashboard]
      summary: Consultar indicadores administrativos
      operationId: getAdminDashboard
      x-roles: [ADMINISTRADOR]
      parameters:
        - { name: fecha, in: query, schema: { type: string, format: date } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Indicadores del periodo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /requests:
    get:
      tags: [Solicitudes]
      summary: Consultar solicitudes
      operationId: listRequests
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoSolicitud' } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoAcompanamiento' } }
        - { name: estudianteId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: asignaturaId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Solicitudes paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Solicitudes]
      summary: Crear solicitud de tutoría o monitoría
      operationId: createRequest
      x-roles: [ESTUDIANTE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
            example:
              tipo: MONITORIA
              asignaturaId: 18
              motivo: Necesito reforzar integrales antes del segundo parcial
              fechaPreferida: '2026-10-01'
              horaPreferida: '14:00'
              modalidadPreferida: PRESENCIAL
      responses:
        '201':
          description: Solicitud registrada como PENDIENTE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicRequest' }
              example:
                idSolicitud: 901
                estudiante:
                  idUsuario: 25
                  codigo: EST20260125
                  nombreCompleto: Laura Hernández Rojas
                tipo: MONITORIA
                asignatura:
                  idAsignatura: 18
                  codigo: MATB-101
                  nombre: Matemáticas Básicas
                  creditos: 3
                  semestre: 1
                  programa:
                    idPrograma: 1
                    codigo: IS
                    nombre: Ingeniería de Sistemas
                    nivel: PREGRADO
                    estado: ACTIVO
                  estado: ACTIVO
                motivo: Necesito reforzar integrales antes del segundo parcial
                fechaPreferida: '2026-10-01'
                horaPreferida: '14:00'
                modalidadPreferida: PRESENCIAL
                responsable: null
                estado: PENDIENTE
                comentarioEstado: null
                createdAt: '2026-09-28T09:15:00-05:00'
                updatedAt: '2026-09-28T09:15:00-05:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /requests/{idSolicitud}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Solicitudes]
      summary: Consultar solicitud
      operationId: getRequest
      responses:
        '200':
          description: Solicitud encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Solicitudes]
      summary: Actualizar estado de solicitud
      operationId: updateRequest
      x-roles: [ADMINISTRADOR, MONITOR, TUTOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRequestStatus' }
            example: { estado: APROBADA, comentario: Solicitud aprobada para asignación. }
      responses:
        '200':
          description: Estado actualizado según transiciones permitidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /requests/{idSolicitud}/cancel:
    post:
      tags: [Solicitudes]
      summary: Cancelar solicitud
      operationId: cancelRequest
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Solicitud cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /requests/{idSolicitud}/assign:
    post:
      tags: [Solicitudes]
      summary: Asignar monitor o tutor
      operationId: assignRequest
      x-roles: [ADMINISTRADOR]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
            example: { responsableId: 33, observacion: Asignación realizada por coordinación. }
      responses:
        '200':
          description: Solicitud asignada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /availability:
    get:
      tags: [Disponibilidad]
      summary: Consultar bloques disponibles
      operationId: listAvailability
      parameters:
        - { name: fecha, in: query, required: true, schema: { type: string, format: date } }
        - { name: asignaturaId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: rol, in: query, schema: { type: string, enum: [MONITOR, TUTOR] } }
        - { name: modalidad, in: query, schema: { $ref: '#/components/schemas/Modalidad' } }
      responses:
        '200':
          description: Bloques disponibles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Disponibilidad]
      summary: Registrar disponibilidad propia
      operationId: createAvailability
      x-roles: [MONITOR, TUTOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAvailability' }
            example:
              fecha: '2026-10-01'
              horaInicio: '14:00'
              horaFin: '16:00'
              modalidad: PRESENCIAL
              espacioSugeridoId: 12
      responses:
        '201':
          description: Disponibilidad registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /availability/{idDisponibilidad}:
    delete:
      tags: [Disponibilidad]
      summary: Eliminar bloque de disponibilidad
      operationId: deleteAvailability
      x-roles: [MONITOR, TUTOR]
      parameters: [{ $ref: '#/components/parameters/AvailabilityId' }]
      responses:
        '204': { description: Bloque eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions:
    get:
      tags: [Sesiones]
      summary: Consultar sesiones
      operationId: listSessions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: fecha, in: query, schema: { type: string, format: date } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoSesion' } }
        - { name: responsableId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: estudianteId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Sesiones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSessions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Sesiones]
      summary: Programar sesión
      operationId: createSession
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSession' }
            example:
              solicitudId: 901
              responsableId: 33
              espacioId: 12
              fecha: '2026-10-01'
              horaInicio: '14:00'
              horaFin: '16:00'
              modalidad: PRESENCIAL
      responses:
        '201':
          description: Sesión programada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example:
                idSesion: 1401
                solicitudId: 901
                estudiante:
                  idUsuario: 25
                  codigo: EST20260125
                  nombreCompleto: Laura Hernández Rojas
                responsable:
                  idUsuario: 33
                  codigo: MON20260133
                  nombreCompleto: Carlos Pérez Gómez
                tipo: MONITORIA
                asignatura:
                  idAsignatura: 18
                  codigo: MATB-101
                  nombre: Matemáticas Básicas
                  creditos: 3
                  semestre: 1
                  programa:
                    idPrograma: 1
                    codigo: IS
                    nombre: Ingeniería de Sistemas
                    nivel: PREGRADO
                    estado: ACTIVO
                  estado: ACTIVO
                espacio: null
                fecha: '2026-10-01'
                horaInicio: '14:00'
                horaFin: '16:00'
                modalidad: PRESENCIAL
                enlaceVirtual: null
                estado: PROGRAMADA
                createdAt: '2026-09-28T09:20:00-05:00'
                updatedAt: '2026-09-28T09:20:00-05:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{idSesion}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [Sesiones]
      summary: Consultar sesión
      operationId: getSession
      responses:
        '200':
          description: Sesión encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sesiones]
      summary: Actualizar sesión
      operationId: updateSession
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSession' }
      responses:
        '200':
          description: Sesión actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{idSesion}/cancel:
    post:
      tags: [Sesiones]
      summary: Cancelar sesión
      operationId: cancelSession
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Sesión cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{idSesion}/attendance:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [Asistencia y seguimiento]
      summary: Consultar asistencia
      operationId: listAttendance
      responses:
        '200':
          description: Registros de asistencia.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Asistencia y seguimiento]
      summary: Registrar o actualizar asistencia
      operationId: upsertAttendance
      x-roles: [MONITOR, TUTOR, ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceRequest' }
            example:
              estudianteId: 25
              asistencia: true
              observacion: Participó en los ejercicios de integración.
              progreso: 80
      responses:
        '200':
          description: Registro guardado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{idSesion}/evidences:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [Evidencias]
      summary: Listar evidencias
      operationId: listEvidences
      responses:
        '200':
          description: Evidencias de la sesión.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Evidencias]
      summary: Cargar evidencia
      operationId: createEvidence
      x-roles: [MONITOR, TUTOR, ADMINISTRADOR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/EvidenceUpload' }
      responses:
