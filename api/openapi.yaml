      tags: [Informes mensuales]
      summary: Consultar informe mensual
      operationId: getMonthlyReport
      responses:
        '200':
          description: Informe encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Informes mensuales]
      summary: Editar borrador
      operationId: updateMonthlyReport
      x-roles: [MONITOR, TUTOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMonthlyReport' }
      responses:
        '200':
          description: Informe actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /monthly-reports/{idInforme}/submit:
    post:
      tags: [Informes mensuales]
      summary: Enviar informe a revisión
      operationId: submitMonthlyReport
      x-roles: [MONITOR, TUTOR]
      parameters: [{ $ref: '#/components/parameters/ReportId' }]
      responses:
        '200':
          description: Informe enviado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /monthly-reports/{idInforme}/review:
    post:
      tags: [Informes mensuales]
      summary: Aprobar o rechazar informe
      operationId: reviewMonthlyReport
      x-roles: [ADMINISTRADOR]
      parameters: [{ $ref: '#/components/parameters/ReportId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewMonthlyReport' }
            example: { decision: APROBADO, comentario: Informe validado por coordinación. }
      responses:
        '200':
          description: Revisión registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por /auth/select-role.
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: idUsuario
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RequestId:
      name: idSolicitud
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AvailabilityId:
      name: idDisponibilidad
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: idSesion
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    EvidenceId:
      name: idEvidencia
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ReportId:
      name: idInforme
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Solicitud incorrecta.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            status: 400
            code: BAD_REQUEST
            message: La solicitud no puede ser procesada.
            path: /api/v1/requests
            timestamp: '2026-09-28T17:00:00-05:00'
            requestId: req_01J8YQ9Z8J
    Unauthorized:
      description: Autenticación requerida o token inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            status: 401
            code: UNAUTHORIZED
            message: El token de acceso es inválido o ha expirado.
            path: /api/v1/auth/me
            timestamp: '2026-09-28T17:01:00-05:00'
            requestId: req_01J8YQ9Z8K
    Forbidden:
      description: El rol activo no tiene permisos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflicto con el estado actual o una restricción única.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Error de validación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            status: 422
            code: VALIDATION_ERROR
            message: Uno o más campos no cumplen las reglas de validación.
            path: /api/v1/resource
            timestamp: '2026-09-28T17:03:00-05:00'
            requestId: req_01J8YQ9Z8N
            details:
              - { field: correo, issue: Debe ser un correo institucional válido. }
    TooManyRequests:
      description: Demasiados intentos.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: El archivo excede el límite permitido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnsupportedMediaType:
      description: Tipo de archivo no permitido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [status, code, message, path, timestamp, requestId]
      properties:
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        message: { type: string, minLength: 1, maxLength: 500 }
        path: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string, minLength: 8, maxLength: 64 }
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    RoleName:
      type: string
      enum: [ADMINISTRADOR, MONITOR, TUTOR, ESTUDIANTE]
    EstadoUsuario:
      type: string
      enum: [ACTIVO, INACTIVO, BLOQUEADO]
    EstadoCatalogo:
      type: string
      enum: [ACTIVO, INACTIVO]
    EstadoSolicitud:
      type: string
      enum: [PENDIENTE, APROBADA, RECHAZADA, ASIGNADA, ATENDIDA, CANCELADA]
    EstadoSesion:
      type: string
      enum: [PROGRAMADA, EN_CURSO, COMPLETADA, CANCELADA]
    EstadoDisponibilidad:
      type: string
      enum: [DISPONIBLE, RESERVADA, BLOQUEADA]
    EstadoInforme:
      type: string
      enum: [BORRADOR, EN_REVISION, APROBADO, RECHAZADO]
    EstadoEspacio:
      type: string
      enum: [ACTIVO, INACTIVO, MANTENIMIENTO]
    TipoAcompanamiento:
      type: string
      enum: [MONITORIA, TUTORIA]
    Modalidad:
      type: string
      enum: [PRESENCIAL, VIRTUAL, HIBRIDA]
    Role:
      type: object
      required: [idRol, nombre, nombreDisplay]
      properties:
        idRol: { type: integer, minimum: 1, example: 2 }
        nombre: { $ref: '#/components/schemas/RoleName' }
        nombreDisplay: { type: string, example: Monitor }
    UserSummary:
      type: object
      required: [idUsuario, codigo, nombreCompleto]
      properties:
        idUsuario: { type: integer, minimum: 1 }
        codigo: { type: string, example: MON20260125 }
        nombreCompleto: { type: string, example: Laura Hernández Rojas }
    User:
      type: object
      required: [idUsuario, codigo, documento, nombres, apellidos, correo, estado, roles, createdAt, updatedAt]
      properties:
        idUsuario: { type: integer, minimum: 1, example: 25 }
        codigo: { type: string, minLength: 4, maxLength: 30, example: MON20260125 }
        documento: { type: string, minLength: 5, maxLength: 20, example: '1009123456' }
        nombres: { type: string, minLength: 2, maxLength: 80, example: Laura }
        apellidos: { type: string, minLength: 2, maxLength: 80, example: Hernández Rojas }
        nombreCompleto: { type: string, example: Laura Hernández Rojas }
        correo: { type: string, format: email, example: laura.hernandez@unitropico.edu.co }
        telefono: { type: [string, 'null'], minLength: 7, maxLength: 20, example: '3185550123' }
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RoleName' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [codigo, password]
      properties:
        codigo: { type: string, minLength: 4, maxLength: 30 }
        password: { type: string, minLength: 8, maxLength: 100, format: password }
    LoginResponse:
      type: object
      required: [preAuthToken, requiresRoleSelection, user]
      properties:
        preAuthToken: { type: string, minLength: 10 }
        requiresRoleSelection: { type: boolean }
        user:
          type: object
          required: [idUsuario, codigo, nombres, apellidos, correo, roles]
          properties:
            idUsuario: { type: integer, minimum: 1 }
            codigo: { type: string }
            nombres: { type: string }
            apellidos: { type: string }
            correo: { type: string, format: email }
            roles:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RoleName' }
    SelectRoleRequest:
      type: object
      required: [preAuthToken, idRol]
      properties:
        preAuthToken: { type: string, minLength: 10 }
        idRol: { type: integer, minimum: 1 }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20 }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn, activeRole]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 1, example: 3600 }
        refreshExpiresIn: { type: integer, minimum: 1, example: 2592000 }
        activeRole: { $ref: '#/components/schemas/RoleName' }
    CurrentUser:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [activeRole]
          properties:
            activeRole: { $ref: '#/components/schemas/RoleName' }
    CreateUserRequest:
      type: object
      required: [codigo, documento, nombres, apellidos, correo, roleIds]
      properties:
        codigo: { type: string, minLength: 4, maxLength: 30 }
        documento: { type: string, minLength: 5, maxLength: 20 }
        nombres: { type: string, minLength: 2, maxLength: 80 }
        apellidos: { type: string, minLength: 2, maxLength: 80 }
        correo: { type: string, format: email }
        telefono: { type: string, minLength: 7, maxLength: 20 }
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        roleIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        nombres: { type: string, minLength: 2, maxLength: 80 }
        apellidos: { type: string, minLength: 2, maxLength: 80 }
        correo: { type: string, format: email }
        telefono: { type: [string, 'null'], minLength: 7, maxLength: 20 }
        estado: { $ref: '#/components/schemas/EstadoUsuario' }
        roleIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    CreateRequest:
      type: object
      required: [tipo, asignaturaId, motivo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoAcompanamiento' }
        asignaturaId: { type: integer, minimum: 1 }
        motivo: { type: string, minLength: 10, maxLength: 1000 }
        fechaPreferida: { type: string, format: date }
        horaPreferida: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        modalidadPreferida: { $ref: '#/components/schemas/Modalidad' }
    AcademicRequest:
      type: object
      required: [idSolicitud, estudiante, tipo, asignatura, motivo, estado, createdAt, updatedAt]
      properties:
        idSolicitud: { type: integer, minimum: 1, example: 901 }
        estudiante: { $ref: '#/components/schemas/UserSummary' }
        tipo: { $ref: '#/components/schemas/TipoAcompanamiento' }
        asignatura: { $ref: '#/components/schemas/Subject' }
        motivo: { type: string }
        fechaPreferida: { type: [string, 'null'], format: date }
        horaPreferida: { type: [string, 'null'] }
        modalidadPreferida: { $ref: '#/components/schemas/Modalidad' }
        responsable:
          oneOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        estado: { $ref: '#/components/schemas/EstadoSolicitud' }
        comentarioEstado: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateRequestStatus:
      type: object
      required: [estado]
      properties:
        estado: { $ref: '#/components/schemas/EstadoSolicitud' }
        comentario: { type: string, maxLength: 1000 }
    CancelRequest:
      type: object
      properties:
        motivo: { type: string, minLength: 5, maxLength: 500 }
    AssignRequest:
      type: object
      required: [responsableId]
      properties:
        responsableId: { type: integer, minimum: 1 }
        observacion: { type: string, maxLength: 1000 }
    CreateAvailability:
      type: object
      required: [fecha, horaInicio, horaFin, modalidad]
      properties:
        fecha: { type: string, format: date }
        horaInicio: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        horaFin: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        espacioSugeridoId: { type: integer, minimum: 1 }
    Availability:
      type: object
      required: [idDisponibilidad, usuario, fecha, horaInicio, horaFin, modalidad, estado]
      properties:
        idDisponibilidad: { type: integer, minimum: 1 }
        usuario: { $ref: '#/components/schemas/UserSummary' }
        rol: { type: string, enum: [MONITOR, TUTOR] }
        fecha: { type: string, format: date }
        horaInicio: { type: string }
        horaFin: { type: string }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        espacioSugerido:
          oneOf:
            - { $ref: '#/components/schemas/Space' }
            - { type: 'null' }
        estado: { $ref: '#/components/schemas/EstadoDisponibilidad' }
    CreateSession:
      type: object
      required: [solicitudId, responsableId, fecha, horaInicio, horaFin, modalidad]
      properties:
        solicitudId: { type: integer, minimum: 1 }
        responsableId: { type: integer, minimum: 1 }
        espacioId: { type: integer, minimum: 1 }
        fecha: { type: string, format: date }
        horaInicio: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        horaFin: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        enlaceVirtual: { type: [string, 'null'], format: uri }
    UpdateSession:
      type: object
      minProperties: 1
      properties:
        fecha: { type: string, format: date }
        horaInicio: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        horaFin: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        espacioId: { type: [integer, 'null'], minimum: 1 }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        estado: { $ref: '#/components/schemas/EstadoSesion' }
        enlaceVirtual: { type: [string, 'null'], format: uri }
    Session:
      type: object
      required: [idSesion, solicitudId, estudiante, responsable, tipo, asignatura, fecha, horaInicio, horaFin, modalidad, estado, createdAt, updatedAt]
      properties:
        idSesion: { type: integer, minimum: 1, example: 1401 }
        solicitudId: { type: integer, minimum: 1 }
        estudiante: { $ref: '#/components/schemas/UserSummary' }
        responsable: { $ref: '#/components/schemas/UserSummary' }
        tipo: { $ref: '#/components/schemas/TipoAcompanamiento' }
        asignatura: { $ref: '#/components/schemas/Subject' }
        espacio:
          oneOf:
            - { $ref: '#/components/schemas/Space' }
            - { type: 'null' }
        fecha: { type: string, format: date }
        horaInicio: { type: string }
        horaFin: { type: string }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        enlaceVirtual: { type: [string, 'null'], format: uri }
        estado: { $ref: '#/components/schemas/EstadoSesion' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttendanceRequest:
      type: object
      required: [estudianteId, asistencia]
      properties:
        estudianteId: { type: integer, minimum: 1 }
        asistencia: { type: boolean }
        observacion: { type: string, maxLength: 2000 }
        progreso: { type: integer, minimum: 0, maximum: 100 }
    Attendance:
      type: object
      required: [idAsistencia, sesionId, estudianteId, asistencia, registradoAt]
      properties:
        idAsistencia: { type: integer, minimum: 1 }
        sesionId: { type: integer, minimum: 1 }
        estudianteId: { type: integer, minimum: 1 }
        asistencia: { type: boolean }
        observacion: { type: [string, 'null'] }
        progreso: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        registradoPor: { $ref: '#/components/schemas/UserSummary' }
        registradoAt: { type: string, format: date-time }
    EvidenceUpload:
      type: object
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: PDF, JPG, PNG o DOCX de máximo 10 MB.
        observacion: { type: string, maxLength: 1000 }
    Evidence:
      type: object
      required: [idEvidencia, sesionId, nombreArchivo, tipoMime, tamanoBytes, url, createdAt]
      properties:
        idEvidencia: { type: integer, minimum: 1 }
        sesionId: { type: integer, minimum: 1 }
        nombreArchivo: { type: string, maxLength: 255 }
        tipoMime:
          type: string
          enum: [application/pdf, image/jpeg, image/png, application/vnd.openxmlformats-officedocument.wordprocessingml.document]
        tamanoBytes: { type: integer, minimum: 1 }
        observacion: { type: [string, 'null'] }
        url: { type: string, format: uri }
        uploadedBy: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    Program:
      type: object
      required: [idPrograma, codigo, nombre, nivel, estado]
      properties:
        idPrograma: { type: integer, minimum: 1 }
        codigo: { type: string, minLength: 2, maxLength: 20, example: IS }
        nombre: { type: string, minLength: 3, maxLength: 150, example: Ingeniería de Sistemas }
        nivel: { type: string, enum: [PREGRADO, POSGRADO] }
        estado: { $ref: '#/components/schemas/EstadoCatalogo' }
    CreateProgram:
      type: object
      required: [codigo, nombre, nivel]
      properties:
        codigo: { type: string, minLength: 2, maxLength: 20 }
        nombre: { type: string, minLength: 3, maxLength: 150 }
        nivel: { type: string, enum: [PREGRADO, POSGRADO] }
    Subject:
      type: object
      required: [idAsignatura, codigo, nombre, creditos, semestre, programa, estado]
      properties:
        idAsignatura: { type: integer, minimum: 1, example: 18 }
        codigo: { type: string, minLength: 2, maxLength: 20, example: MATB-101 }
        nombre: { type: string, example: Matemáticas Básicas }
        creditos: { type: integer, minimum: 1, maximum: 10 }
        semestre: { type: integer, minimum: 1, maximum: 20 }
        programa: { $ref: '#/components/schemas/Program' }
        estado: { $ref: '#/components/schemas/EstadoCatalogo' }
    CreateSubject:
      type: object
      required: [codigo, nombre, creditos, semestre, programaId]
      properties:
        codigo: { type: string, minLength: 2, maxLength: 20 }
        nombre: { type: string, minLength: 3, maxLength: 150 }
        creditos: { type: integer, minimum: 1, maximum: 10 }
        semestre: { type: integer, minimum: 1, maximum: 20 }
        programaId: { type: integer, minimum: 1 }
    Space:
      type: object
      required: [idEspacio, codigo, nombre, edificio, capacidad, tipo, estado]
      properties:
        idEspacio: { type: integer, minimum: 1 }
        codigo: { type: string, example: A-204 }
        nombre: { type: string, example: Salón 204 }
        edificio: { type: string, example: Bloque A }
        bloque: { type: [string, 'null'], example: A }
        salon: { type: [string, 'null'], example: '204' }
        capacidad: { type: integer, minimum: 1 }
        tipo: { type: string, enum: [AULA, LABORATORIO, AUDITORIO, BIBLIOTECA, OTRO] }
        estado: { $ref: '#/components/schemas/EstadoEspacio' }
        piso: { type: [integer, 'null'], minimum: 0 }
        ubicacion: { type: [string, 'null'] }
        recursos: { type: array, items: { type: string } }
        observaciones: { type: [string, 'null'] }
    CreateSpace:
      type: object
      required: [codigo, nombre, edificio, capacidad, tipo]
      properties:
        codigo: { type: string, minLength: 2, maxLength: 30 }
        nombre: { type: string, minLength: 2, maxLength: 100 }
        edificio: { type: string, minLength: 2, maxLength: 100 }
        capacidad: { type: integer, minimum: 1, maximum: 1000 }
        tipo: { type: string, enum: [AULA, LABORATORIO, AUDITORIO, BIBLIOTECA, OTRO] }
        piso: { type: integer, minimum: 0 }
        recursos: { type: array, items: { type: string, maxLength: 100 } }
        observaciones: { type: string, maxLength: 1000 }
    AdminDashboard:
      type: object
      required: [desde, hasta, usuariosActivos, solicitudesPendientes, sesionesProgramadas, espaciosDisponibles]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        usuariosActivos: { type: integer, minimum: 0 }
        solicitudesPendientes: { type: integer, minimum: 0 }
        sesionesProgramadas: { type: integer, minimum: 0 }
        espaciosDisponibles: { type: integer, minimum: 0 }
        asistenciasRegistradas: { type: integer, minimum: 0 }
        sesionesCompletadas: { type: integer, minimum: 0 }
        horasAcompanamiento: { type: number, minimum: 0 }
    ReportResponse:
      type: object
      required: [reporteId, tipo, formato, fechaInicio, fechaFin, totalRegistros, downloadUrl, expiresAt]
      properties:
        reporteId: { type: string }
        tipo: { type: string, enum: [SESIONES, SOLICITUDES, ASISTENCIA, USUARIOS] }
        formato: { type: string, enum: [PDF, XLSX, CSV] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        totalRegistros: { type: integer, minimum: 0 }
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    CreateMonthlyReport:
      type: object
      required: [periodo, plantillaVersion, actividadesRealizadas, sesionesAtendidas, estudiantesAtendidos, horasAcompanamiento, logros, dificultades, compromisos]
      properties:
        periodo: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
        plantillaVersion: { type: string, minLength: 1, maxLength: 20 }
        actividadesRealizadas: { type: integer, minimum: 0 }
        sesionesAtendidas: { type: integer, minimum: 0 }
        estudiantesAtendidos: { type: integer, minimum: 0 }
        horasAcompanamiento: { type: number, minimum: 0, maximum: 744 }
        logros: { type: string, minLength: 10, maxLength: 3000 }
        dificultades: { type: string, minLength: 10, maxLength: 3000 }
        compromisos: { type: string, minLength: 10, maxLength: 3000 }
    UpdateMonthlyReport:
      type: object
      minProperties: 1
      properties:
        actividadesRealizadas: { type: integer, minimum: 0 }
        sesionesAtendidas: { type: integer, minimum: 0 }
        estudiantesAtendidos: { type: integer, minimum: 0 }
        horasAcompanamiento: { type: number, minimum: 0, maximum: 744 }
        logros: { type: string, minLength: 10, maxLength: 3000 }
        dificultades: { type: string, minLength: 10, maxLength: 3000 }
        compromisos: { type: string, minLength: 10, maxLength: 3000 }
    ReviewMonthlyReport:
      type: object
      required: [decision, comentario]
      properties:
        decision: { type: string, enum: [APROBADO, RECHAZADO] }
        comentario: { type: string, minLength: 5, maxLength: 2000 }
    MonthlyReport:
      allOf:
        - { $ref: '#/components/schemas/CreateMonthlyReport' }
        - type: object
          required: [idInforme, usuario, estado, createdAt, updatedAt]
          properties:
            idInforme: { type: integer, minimum: 1, example: 5001 }
            usuario: { $ref: '#/components/schemas/UserSummary' }
            rol: { type: string, enum: [MONITOR, TUTOR] }
            estado: { $ref: '#/components/schemas/EstadoInforme' }
            comentarioRevision: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PaginatedUsers:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PaginatedRequests:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AcademicRequest' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PaginatedSessions:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Session' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PaginatedPrograms:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Program' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PaginatedSubjects:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subject' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PaginatedSpaces:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Space' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PaginatedMonthlyReports:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MonthlyReport' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

x-contract:
  apiVersion: v1
  timezone: America/Bogota
  idempotency:
    recommendedFor:
      - 'POST /requests'
      - 'POST /sessions'
      - 'POST /sessions/{idSesion}/evidences'
    header: Idempotency-Key
  conventions:
    date: ISO 8601 date (YYYY-MM-DD)
    dateTime: ISO 8601 date-time with timezone offset
    time: 24-hour format (HH:mm)
    pagination: page and pageSize with data/meta response
    errors: ApiError with requestId for traceability
  stateTransitions:
    solicitud: 'PENDIENTE -> [APROBADA, RECHAZADA, CANCELADA]; APROBADA -> [ASIGNADA, CANCELADA]; ASIGNADA -> [ATENDIDA, CANCELADA]'
    sesion: 'PROGRAMADA -> [EN_CURSO, CANCELADA]; EN_CURSO -> [COMPLETADA, CANCELADA]'
    informe: 'BORRADOR -> EN_REVISION; EN_REVISION -> [APROBADO, RECHAZADO]; RECHAZADO -> BORRADOR'