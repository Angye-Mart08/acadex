openapi: 3.1.0
info:
  title: API de Gestión de Tutorías y Monitorías — Unitrópico
  version: 0.1.0
  summary: Contrato REST inicial alineado con el primer avance del frontend
  description: |
    Contrato de la API REST para la plataforma web de gestión de tutorías y
    monitorías académicas de Unitrópico.

    Arquitectura prevista: React + TypeScript → Node.js + TypeScript → MariaDB.
    Las fechas y horas utilizan la zona horaria institucional America/Bogota.
  contact:
    name: Equipo de desarrollo de Unitrópico
    email: soporte.tutorias@unitropico.edu.co
servers:
  - url: http://localhost:3000/api/v1
    description: API local de desarrollo
tags:
  - name: Autenticación
  - name: Portal personal
  - name: Usuarios
  - name: Espacios
  - name: Solicitudes
paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con correo institucional y documento
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jaysonquintero@unitropico.edu.co
              document: '1000000010'
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/select-role:
    post:
      tags: [Autenticación]
      summary: Seleccionar el rol activo de la sesión
      operationId: selectRole
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSelectionRequest'
      responses:
        '200':
          description: Rol seleccionado y sesión emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar el usuario autenticado
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar la sesión actual
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada correctamente.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portal/dashboard:
    get:
      tags: [Portal personal]
      summary: Obtener el resumen del portal según el rol
      operationId: getPortalDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indicadores y próximos compromisos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /availability:
    get:
      tags: [Portal personal]
      summary: Consultar disponibilidad propia
      operationId: listAvailability
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bloques de disponibilidad del tutor o monitor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Portal personal]
      summary: Registrar un bloque de disponibilidad
      operationId: createAvailability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityInput'
      responses:
        '201':
          description: Disponibilidad registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sessions:
    get:
      tags: [Portal personal]
      summary: Consultar sesiones visibles para el usuario
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones filtradas por permisos del usuario autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /monthly-reports:
    get:
      tags: [Portal personal]
      summary: Consultar informes del tutor
      operationId: listMonthlyReports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Informes visibles para el usuario autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Portal personal]
      summary: Crear un informe mensual
      operationId: createMonthlyReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyReportInput'
      responses:
        '201':
          description: Informe creado como borrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios para administración
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Usuarios paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Usuarios]
      summary: Crear un usuario con uno o varios roles
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    patch:
      tags: [Usuarios]
      summary: Actualizar datos o estado de un usuario
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Usuario eliminado correctamente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /spaces:
    get:
      tags: [Espacios]
      summary: Listar espacios disponibles
      operationId: listSpaces
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: Espacios registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Espacios]
      summary: Registrar un espacio
      operationId: createSpace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceInput'
      responses:
        '201':
          description: Espacio registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /spaces/{id}:
    patch:
      tags: [Espacios]
      summary: Actualizar datos o estado de un espacio
      operationId: updateSpace
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceUpdate'
      responses:
        '200':
          description: Espacio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Espacios]
      summary: Eliminar un espacio
      operationId: deleteSpace
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '204':
          description: Espacio eliminado correctamente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /requests:
    get:
      tags: [Solicitudes]
      summary: Listar solicitudes visibles para el rol autenticado
      operationId: listRequests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Solicitudes filtradas según permisos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Solicitudes]
      summary: Crear una solicitud de acompañamiento como estudiante
      operationId: createRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInput'
      responses:
        '201':
          description: Solicitud creada en estado Pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /requests/{id}:
    patch:
      tags: [Solicitudes]
      summary: Aprobar, rechazar o asignar una solicitud
      operationId: updateRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdate'
      responses:
        '200':
          description: Solicitud actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      description: Texto para buscar por nombre, código, correo o asignatura.
      schema:
        type: string
        maxLength: 120
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SpaceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El rol autenticado no tiene permiso para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflicto con un registro existente o una transición de estado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Los datos recibidos no cumplen las reglas de validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Role:
      type: string
      enum: [Administrador, Tutor, Monitor, Estudiante]
    Status:
      type: string
      enum: [Activo, Inactivo]
    RequestStatus:
      type: string
      enum: [Pendiente, Aprobada, Asignada, Rechazada, Cancelada, Atendida, Finalizada]
    Priority:
      type: string
      enum: [Alta, Media, Baja]
    Modality:
      type: string
      enum: [Presencial, Virtual, Híbrida]
    User:
      type: object
      required: [id, code, name, email, roles, status, initials]
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: string, maxLength: 20 }
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 120 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/Status' }
        initials: { type: string, minLength: 1, maxLength: 3 }
    LoginRequest:
      type: object
      required: [email, document]
      properties:
        email: { type: string, format: email, maxLength: 120 }
        document: { type: string, minLength: 5, maxLength: 20, pattern: '^[0-9A-Za-z-]+$' }
    LoginResponse:
      type: object
      required: [roles, requiresRoleSelection, user]
      properties:
        preAuthToken:
          type: string
          description: Token temporal emitido mientras el usuario selecciona un rol.
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 60 }
        requiresRoleSelection: { type: boolean }
        activeRole:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: Rol actualmente seleccionado para la sesión.
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
        user: { $ref: '#/components/schemas/User' }
    RoleSelectionRequest:
      type: object
      required: [preAuthToken, role]
      properties:
        preAuthToken: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Role' }
    UserInput:
      type: object
      required: [code, document, name, email, roles]
      properties:
        code: { type: string, minLength: 2, maxLength: 20 }
        document: { type: string, minLength: 5, maxLength: 20 }
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 120 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 120 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/Status' }
    Space:
      type: object
      required: [id, code, name, type, location, capacity, status]
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 120 }
        type: { type: string, enum: [Aula, Laboratorio, Sala, Biblioteca, Virtual, Otro] }
        location: { type: string, maxLength: 200 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        status: { $ref: '#/components/schemas/Status' }
    SpaceInput:
      type: object
      required: [code, name, type, location, capacity]
      properties:
        code: { type: string, minLength: 2, maxLength: 20 }
        name: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, enum: [Aula, Laboratorio, Sala, Biblioteca, Virtual, Otro] }
        location: { type: string, minLength: 2, maxLength: 200 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
    SpaceUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, enum: [Aula, Laboratorio, Sala, Biblioteca, Virtual, Otro] }
        location: { type: string, minLength: 2, maxLength: 200 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        status: { $ref: '#/components/schemas/Status' }
    Request:
      type: object
      required: [id, student, subject, type, priority, status, date]
      properties:
        id: { type: integer, minimum: 1 }
        student: { type: string, maxLength: 160 }
        subject: { type: string, maxLength: 150 }
        type: { type: string, enum: [Monitoría, Tutoría] }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        date: { type: string, format: date }
    RequestInput:
      type: object
      required: [subject, type, priority, reason]
      properties:
        subject: { type: string, minLength: 2, maxLength: 150 }
        type: { type: string, enum: [Monitoría, Tutoría] }
        priority: { $ref: '#/components/schemas/Priority' }
        reason: { type: string, minLength: 5, maxLength: 500 }
        preferredDate: { type: string, format: date }
        preferredModality: { $ref: '#/components/schemas/Modality' }
    RequestUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/RequestStatus' }
        assignedUserId: { type: integer, minimum: 1 }
        observation: { type: string, maxLength: 500 }
    Availability:
      type: object
      required: [id, day, startTime, endTime, subject, place, status]
      properties:
        id: { type: integer, minimum: 1 }
        day: { type: string, enum: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado] }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        subject: { type: string, maxLength: 150 }
        place: { type: string, maxLength: 200 }
        modality: { $ref: '#/components/schemas/Modality' }
        status: { $ref: '#/components/schemas/Status' }
    AvailabilityInput:
      type: object
      required: [day, startTime, endTime, subject, modality]
      properties:
        day: { type: string, enum: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado] }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        subject: { type: string, minLength: 2, maxLength: 150 }
        place: { type: string, maxLength: 200 }
        modality: { $ref: '#/components/schemas/Modality' }
    Session:
      type: object
      required: [id, subject, date, startTime, endTime, modality, status]
      properties:
        id: { type: integer, minimum: 1 }
        subject: { type: string, maxLength: 150 }
        date: { type: string, format: date }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        modality: { $ref: '#/components/schemas/Modality' }
        place: { type: string, maxLength: 200 }
        status: { type: string, enum: [Programada, EnCurso, Finalizada, Cancelada] }
    MonthlyReport:
      type: object
      required: [id, title, period, status]
      properties:
        id: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        period: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' }
        status: { type: string, enum: [Borrador, EnRevision, Aprobado, Rechazado] }
        summary: { type: string, maxLength: 1000 }
    MonthlyReportInput:
      type: object
      required: [title, period, summary]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        period: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' }
        summary: { type: string, minLength: 10, maxLength: 1000 }
        achievements: { type: string, maxLength: 1000 }
        difficulties: { type: string, maxLength: 1000 }
        recommendations: { type: string, maxLength: 1000 }
    PortalDashboard:
      type: object
      required: [role, metrics, upcoming]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        metrics:
          type: array
          items:
            type: object
            required: [label, value, detail]
            properties:
              label: { type: string }
              value: { type: string }
              detail: { type: string }
        upcoming:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PaginatedUsers:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedRequests:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Request' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ApiError:
      type: object
      required: [status, code, message, path, timestamp]
      properties:
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string }
        details:
          type: array
          items: { type: object, additionalProperties: true }
